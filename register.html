<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Guest Account | Bloom & Form</title>
  <meta name="description" content="Register for a Bloom & Form guest account to book floral design workshops, save seasonal preferences, and earn rewards.">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="login-page-body">

  <!-- TOP RIGHT SCREEN CONTROLS (FIXED TO TOP RIGHT OF VIEWPORT) -->
  <div class="auth-page-controls">
    <button class="ctrl-btn js-theme-toggle" aria-label="Toggle Theme" title="Toggle Theme"><span>◐</span></button>
    <button class="ctrl-btn js-rtl-toggle" aria-label="Toggle Direction" title="Toggle Direction"><span>⇄</span></button>
  </div>

  <div class="auth-page-container register-container">
    <!-- REGISTER CARD WRAPPER -->
    <div class="login-card-wrapper">
      <div class="login-card hover-petal-card">
        
        <!-- BRAND LOGO BADGE IN CARD (ICON & NAME IN SAME ROW) -->
        <div style="text-align: center; display: flex; justify-content: center; margin-bottom: var(--space-xs);">
          <a href="index.html" class="brand-logo" style="display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 10px; text-decoration: none;">
            <svg class="logo-icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" style="width: 34px; height: 34px; flex-shrink: 0;">
              <circle cx="16" cy="16" r="14" stroke="var(--terracotta-bloom)" stroke-width="2" fill="var(--bg-surface-elevated)"/>
              <path d="M16 8V24M10 16H22M12 12C14 14 18 14 20 12M12 20C14 18 18 18 20 20" stroke="var(--terracotta-bloom)" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            <div class="brand-text" style="text-align: start;">
              <span class="brand-name" style="font-size: 1.25rem; letter-spacing: 0.14em; color: var(--text-main); font-weight: 800; font-family: var(--font-sans); display: block; line-height: 1.1;">BLOOM & FORM</span>
              <span class="brand-descriptor" style="font-size: 0.65rem; letter-spacing: 0.1em; color: var(--terracotta-bloom); display: block; text-transform: uppercase; margin-top: 2px;">FLORAL DESIGN WORKSHOPS</span>
            </div>
          </a>
        </div>

        <div style="text-align: center;">
          <h2 style="font-size: 1.05rem; font-family: var(--font-serif); font-weight: 700; letter-spacing: 0.08em; margin-top: 2px; color: var(--text-main); text-transform: uppercase;">CREATE GUEST ACCOUNT</h2>
          <p style="font-size: 0.825rem; color: var(--text-muted); margin-top: 4px; line-height: 1.4;">Set up your studio guest portal to manage workshop bookings and rewards.</p>
        </div>

        <form id="register-form" style="display: flex; flex-direction: column; gap: var(--space-md);">
          
          <div class="form-group">
            <label for="reg-firstname" style="font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-main);">First Name *</label>
            <input type="text" id="reg-firstname" class="form-control" placeholder="Sarah" required style="padding: 11px 14px; background: var(--bg-surface-elevated); border: 1px solid var(--border-color); border-radius: var(--radius-sm); width: 100%; box-sizing: border-box;">
          </div>

          <div class="form-group">
            <label for="reg-lastname" style="font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-main);">Last Name *</label>
            <input type="text" id="reg-lastname" class="form-control" placeholder="Morgan" required style="padding: 11px 14px; background: var(--bg-surface-elevated); border: 1px solid var(--border-color); border-radius: var(--radius-sm); width: 100%; box-sizing: border-box;">
          </div>

          <div class="form-group">
            <label for="reg-email" style="font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-main);">Email Address *</label>
            <input type="email" id="reg-email" class="form-control" placeholder="guest@example.com" required style="padding: 11px 14px; background: var(--bg-surface-elevated); border: 1px solid var(--border-color); border-radius: var(--radius-sm); width: 100%; box-sizing: border-box;">
          </div>

          <div class="form-group">
            <label for="reg-password" style="font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-main);">Password *</label>
            <div class="password-input-wrapper">
              <input type="password" id="reg-password" class="form-control" placeholder="Minimum 6 characters" required minlength="6" style="padding: 11px 14px; padding-inline-end: 55px; background: var(--bg-surface-elevated); border: 1px solid var(--border-color); border-radius: var(--radius-sm); width: 100%; box-sizing: border-box;">
              <button type="button" id="toggle-reg-password" class="toggle-password-btn" style="inset-inline-end: 14px;">Show</button>
            </div>
          </div>

          <div class="form-group">
            <label for="reg-confirm-password" style="font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-main);">Confirm Password *</label>
            <div class="password-input-wrapper">
              <input type="password" id="reg-confirm-password" class="form-control" placeholder="Re-enter password" required minlength="6" style="padding: 11px 14px; padding-inline-end: 55px; background: var(--bg-surface-elevated); border: 1px solid var(--border-color); border-radius: var(--radius-sm); width: 100%; box-sizing: border-box;">
              <button type="button" id="toggle-reg-confirm-password" class="toggle-password-btn" style="inset-inline-end: 14px;">Show</button>
            </div>
          </div>

          <div style="font-size: 0.85rem; margin-top: 4px;">
            <label style="display: flex; align-items: flex-start; gap: 8px; cursor: pointer; color: var(--text-muted); line-height: 1.4;">
              <input type="checkbox" required style="accent-color: var(--terracotta-bloom); margin-top: 3px;">
              <span>I agree to the <a href="#" onclick="alert('Terms & Privacy policy dialog.'); return false;" class="auth-link">Terms of Service</a> and <a href="#" onclick="alert('Terms & Privacy policy dialog.'); return false;" class="auth-link">Privacy Policy</a>.</span>
            </label>
          </div>

          <span id="register-error" class="form-error" style="text-align: center; color: #D9534F; font-size: 0.85rem;"></span>

          <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 4px; padding: 12px 20px; font-size: 0.9rem; font-weight: 700; border-radius: var(--radius-sm); text-transform: uppercase; letter-spacing: 0.05em; box-sizing: border-box;">
            CREATE ACCOUNT <span class="btn-arrow">→</span>
          </button>

          <div class="auth-divider">OR</div>

          <!-- SOCIAL LOGIN BUTTONS -->
          <div class="social-login-grid">
            <button type="button" class="social-login-btn js-social-login" data-provider="Google">
              <svg width="18" height="18" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
              </svg>
              Google
            </button>
            <button type="button" class="social-login-btn js-social-login" data-provider="Apple">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.35c.67-.82 1.12-1.96.99-3.1-.97.04-2.14.65-2.83 1.45-.62.72-1.16 1.88-1.01 3 .01 0 .03 0 .05 0 1.09 0 2.13-.53 2.8-1.35z"/>
              </svg>
              Apple
            </button>
          </div>

          <div style="text-align: center; margin-top: var(--space-xs); font-size: 0.85rem; color: var(--text-muted);">
            Already have an account? <a href="login.html" class="auth-link">Sign In</a>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="assets/js/main.js"></script>
</body>
</html>
